---
# Fork-only: builds just the macOS disk images when this branch is pushed, without the
# Windows and Linux jobs of ci.yml. Lives on the build/macos branch only.
name: Fork macOS build
permissions: {}

on:
  push:
    branches:
      - build/macos

jobs:
  macos:
    name: macOS
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      # Ad hoc signed DMGs for Apple Silicon and Intel; nothing is published.
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: '2.0.0-pr-validation'
      release_channel: 'legacy'
